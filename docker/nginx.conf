# Puerta de entrada de Buenaventura Reporta (único puerto publicado).
#   /          → aplicación React (SPA)
#   /api/      → backend:8000 (Laravel)
#   /storage/  → backend:8000 (imágenes subidas)
#   /app/      → backend:8080 (WebSockets de Laravel Reverb)

# Si la petición pide cambiar a WebSocket se reenvía la cabecera Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolver de Docker: si el backend se recrea (nueva IP) nginx no queda apuntando a la vieja
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Healthcheck del contenedor
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # ---------- API Laravel ----------
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # $http_host conserva el puerto que ve el navegador (p. ej. localhost:8080): Laravel
        # lo usa para generar URLs (enlaces firmados, imágenes). No se envía X-Forwarded-Port
        # porque llevaría el puerto interno del contenedor.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # ---------- Archivos subidos ----------
    location /storage/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    # ---------- WebSockets (Reverb) ----------
    location /app/ {
        set $reverb http://backend:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Recursos con hash: caché larga ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA: cualquier otra ruta la resuelve React Router ----------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
